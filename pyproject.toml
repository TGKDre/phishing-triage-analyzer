[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-analyzer"
version = "0.1.0"
description = "Triage .eml files: check SPF, DKIM and DMARC, extract indicators, score and report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["dnspython>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
phishing-analyzer = "phishing_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
